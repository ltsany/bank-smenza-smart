<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySaving | Bank Smenza Smart</title>
    <link rel="stylesheet" href="my.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/yourkitid.js" crossorigin="anonymous"></script>
</head>

<body>
    <section class="mysaving">
        <h1>MySaving</h1>

        <div class="user-bar">
            <div class="user-info">
                <i class="fa-solid fa-user"></i>
                <span class="username">Akihiko Nakamoto</span>
            </div>

            <select class="sort-option">
                <option value="latest">Terbaru</option>
                <option value="oldest">Terlama</option>
            </select>
        </div>

        <table class="saving-table">
            <thead>
                <tr>
                    <th>Saldo</th>
                    <th>Pemasukkan</th>
                    <th>Tanggal</th>
                    <th>Tabungan Bulan</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Rp. 1.000.000</td>
                    <td>Rp. 50.000</td>
                    <td>28 Oktober 2025</td>
                    <td>Juli</td>
                </tr>
                <tr>
                    <td>Rp. 950.000</td>
                    <td>Rp. 50.000</td>
                    <td>25 September 2025</td>
                    <td>Juni</td>
                </tr>
                <tr>
                    <td>Rp. 900.000</td>
                    <td>Rp. 50.000</td>
                    <td>14 Agustus 2025</td>
                    <td>Mei</td>
                </tr>
                <tr>
                    <td>Rp. 850.000</td>
                    <td>Rp. 50.000</td>
                    <td>10 Juli 2025</td>
                    <td>April</td>
                </tr>
            </tbody>
        </table>

        <div class="total">
            <p><strong>Total Tabungan:</strong> Rp. 1.000.000</p>
        </div>
    </section>
</body>

</html>
